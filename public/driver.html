<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Driver">
  <meta name="theme-color" content="#e66e19">
  <meta name="description" content="OVR LOAD Driver Dispatch">
  <title>OVR LOAD - Driver</title>
  <link rel="manifest" href="/driver-manifest.json">
  <link rel="apple-touch-icon" href="/driver-icon.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0a; --surface: #141414; --surface2: #1e1e1e;
      --border: rgba(255,255,255,0.08); --primary: #e66e19;
      --text: #fff; --text2: #8e8e93; --text3: #5e5e62;
      --green: #25d366; --yellow: #ffc107; --blue: #42a5f5; --orange: #ff9800; --cyan: #00bcd4;
    }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100%; overflow: hidden; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.9rem 1.25rem; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
    .header-brand { display: flex; align-items: center; gap: 0.5rem; }
    .header-brand .ovr { color: var(--primary); font-weight: 800; font-size: 1.2rem; }
    .header-brand .sep { color: var(--text3); }
    .header-brand .label { color: var(--text2); font-weight: 600; font-size: 0.85rem; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .refresh-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 0.4rem 0.85rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .refresh-btn:active { background: var(--primary); color: #fff; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    
    .nav-tabs { position: fixed; top: 57px; left: 0; right: 0; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; z-index: 90; padding: 0.4rem 0.75rem; gap: 0.5rem; }
    .tab-btn { flex: 1; padding: 0.55rem 0.75rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text2); font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: all 0.2s; }
    .tab-btn.active { background: rgba(230,110,25,0.15); color: var(--primary); border-color: rgba(230,110,25,0.4); }
    .tab-badge { background: rgba(255,255,255,0.1); padding: 1px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; color: inherit; }
    .tab-btn.active .tab-badge { background: var(--primary); color: #fff; }

    .list-wrap { position: fixed; top: 108px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 1rem; -webkit-overflow-scrolling: touch; }
    .section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin: 0.5rem 0 0.6rem; padding: 0 0.25rem; }
    .order-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem 1.1rem; margin-bottom: 0.75rem; cursor: pointer; user-select: none; transition: transform 0.15s, border-color 0.15s; }
    .order-card:active { transform: scale(0.98); border-color: var(--primary); }
    .order-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
    .order-id { font-size: 1rem; font-weight: 700; color: var(--primary); }
    .order-badge { font-size: 0.68rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; }
    .badge-pending   { background: rgba(255,193,7,0.15);  color: var(--yellow); border: 1px solid rgba(255,193,7,0.25); }
    .badge-confirmed { background: rgba(66,165,245,0.15); color: var(--blue);   border: 1px solid rgba(66,165,245,0.25); }
    .badge-preparing { background: rgba(255,152,0,0.15); color: var(--orange); border: 1px solid rgba(255,152,0,0.3); }
    .badge-ready     { background: rgba(37,211,102,0.15); color: var(--green);  border: 1px solid rgba(37,211,102,0.25); }
    .badge-completed { background: rgba(0,188,212,0.15);  color: var(--cyan);   border: 1px solid rgba(0,188,212,0.25); }
    .badge-delivered { background: rgba(230,110,25,0.15); color: var(--primary);border: 1px solid rgba(230,110,25,0.25); }

    .order-name  { font-size: 0.92rem; color: var(--text2); margin-bottom: 2px; }
    .order-addr  { font-size: 0.78rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-meta  { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.35rem; flex-wrap: wrap; }
    .origin-pill { font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(230,110,25,0.12); color: var(--primary); border: 1px solid rgba(230,110,25,0.25); }
    .pay-pill    { font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
    .pay-cash    { background: rgba(37,211,102,0.12); color: var(--green);  border: 1px solid rgba(37,211,102,0.25); }
    .pay-whish   { background: rgba(129,140,248,0.12); color: #818cf8;      border: 1px solid rgba(129,140,248,0.25); }
    .order-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 0.55rem; }
    .order-items-preview { font-size: 0.75rem; color: var(--text3); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 0.75rem; }
    .order-total { font-size: 0.95rem; font-weight: 700; color: var(--text); white-space: nowrap; }
    .order-time  { font-size: 0.7rem; color: var(--text3); margin-left: 0.5rem; }
    
    .btn-reverse-card { margin-top: 0.75rem; width: 100%; padding: 0.65rem; background: rgba(255,152,0,0.12); color: var(--orange); border: 1px solid rgba(255,152,0,0.3); border-radius: 10px; font-weight: 700; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: background 0.2s; }
    .btn-reverse-card:active { background: rgba(255,152,0,0.25); }

    .empty { text-align: center; padding: 5rem 2rem; }
    .empty-icon  { font-size: 3.5rem; margin-bottom: 1rem; }
    .empty-title { color: var(--text2); font-size: 1rem; margin-bottom: 0.4rem; }
    .empty-sub   { color: var(--text3); font-size: 0.82rem; }
    
    /* QR Modal & Confirm Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #161616; border: 1px solid #2a2a2a; border-radius: 24px; padding: 1.5rem; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 24px 80px rgba(0,0,0,0.8); margin: auto; }
    .modal-order-id { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 0.2rem; }
    .modal-customer { font-size: 0.88rem; color: var(--text2); margin-bottom: 0.2rem; }
    .modal-address  { font-size: 0.78rem; color: var(--text3); margin-bottom: 1rem; }
    .qr-wrap { display: flex; justify-content: center; align-items: center; background: #fff; border-radius: 16px; padding: 0.85rem; margin-bottom: 0.6rem; }
    .qr-hint { font-size: 0.75rem; color: var(--text3); margin-bottom: 1rem; line-height: 1.5; }
    
    /* Phone input */
    .or-divider { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.85rem; }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .or-divider span { font-size: 0.72rem; color: var(--text3); white-space: nowrap; }
    .phone-row { display: flex; gap: 0.5rem; margin-bottom: 0.85rem; }
    .phone-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 0.75rem 0.9rem; border-radius: 12px; font-size: 1rem; outline: none; -webkit-appearance: none; }
    .phone-row input:focus { border-color: var(--primary); }
    .btn-send-wa { padding: 0.75rem 1rem; background: var(--green); color: #fff; font-weight: 700; font-size: 0.85rem; border: none; border-radius: 12px; cursor: pointer; white-space: nowrap; }
    .btn-send-wa:disabled { opacity: 0.6; }
    
    /* Actions */
    .modal-actions { display: flex; gap: 0.65rem; }
    .btn-pickup { flex: 1; padding: 0.85rem; background: var(--green); color: #fff; font-weight: 700; font-size: 0.9rem; border: none; border-radius: 12px; cursor: pointer; }
    .btn-pickup:active { opacity: 0.8; }
    .btn-close  { padding: 0.85rem 1rem; background: var(--surface2); color: var(--text2); font-size: 0.9rem; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
    
    /* Install banner & Toast */
    .install-banner { display: none; position: fixed; bottom: 1rem; left: 1rem; right: 1rem; background: var(--primary); color: #fff; border-radius: 14px; padding: 0.85rem 1rem; font-size: 0.85rem; font-weight: 600; align-items: center; justify-content: space-between; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.6); }
    .install-banner.show { display: flex; }
    .install-banner button { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 0.4rem 0.85rem; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.82rem; }
    .toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); background: #1e1e1e; color: var(--text); border: 1px solid var(--border); padding: 0.6rem 1.2rem; border-radius: 10px; font-size: 0.82rem; z-index: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-brand">
      <span class="ovr">OVR</span><span class="sep">/</span>
      <span class="label">Driver Dispatch</span>
    </div>
    <div class="header-right">
      <div class="status-dot" id="status-dot" title="Live"></div>
      <button class="refresh-btn" id="refresh-btn">&#x21BB; Refresh</button>
    </div>
  </header>

  <div class="nav-tabs" id="nav-tabs">
    <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">
      <span>&#x1F6F5; Active / Not Picked Up</span>
      <span class="tab-badge" id="badge-active-count">0</span>
    </button>
    <button class="tab-btn" id="tab-history" onclick="switchTab('history')">
      <span>&#x1F4CB; Picked Up History</span>
      <span class="tab-badge" id="badge-history-count">0</span>
    </button>
  </div>

  <div class="list-wrap" id="list-wrap">
    <div class="empty">
      <div class="empty-icon">&#x1F6F5;</div>
      <div class="empty-title">Loading orders...</div>
    </div>
  </div>

  <!-- QR Modal -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal-box">
      <div class="modal-order-id" id="m-order-id">Order #&mdash;</div>
      <div class="modal-customer" id="m-customer"></div>
      <div class="modal-address"  id="m-address"></div>
      <div style="display:flex;align-items:center;gap:0.5rem;justify-content:center;margin-bottom:0.75rem;flex-wrap:wrap;">
        <span class="origin-pill" id="m-origin" style="display:none"></span>
        <span class="pay-pill"    id="m-payment" style="display:none"></span>
      </div>
      <div class="qr-wrap"><div id="qr-canvas"></div></div>
      <div class="qr-hint">&#x1F4F7; Scan with camera &mdash; or enter your number below</div>
      <div class="or-divider"><span>&mdash; or enter your number &mdash;</span></div>
      <div class="phone-row">
        <input type="tel" id="driver-phone" placeholder="+961 3 000 000" inputmode="tel" autocomplete="tel">
        <button class="btn-send-wa" id="btn-send-wa">&#x1F4F2; Send</button>
      </div>
      <div class="modal-actions">
        <button class="btn-pickup" id="btn-pickup">&#x2705; Mark as Picked Up</button>
        <button class="btn-close"  id="btn-close">&#x2715;</button>
      </div>
    </div>
  </div>

  <!-- Revert to Preparing Confirmation Modal -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-box" style="max-width: 340px;">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">&#x26A0;&#xFE0F;</div>
      <div style="font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem;" id="confirm-modal-title">Change Status?</div>
      <div style="font-size: 0.85rem; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.5;" id="confirm-modal-body">
        Are you sure you want to change the status to <b>Preparing</b>?
      </div>
      <div class="modal-actions">
        <button class="btn-close" style="flex:1;" id="btn-cancel-reverse">Cancel</button>
        <button class="btn-pickup" style="flex:1; background: var(--orange);" id="btn-confirm-reverse">Yes, Change to Preparing</button>
      </div>
    </div>
  </div>

  <div class="install-banner" id="install-banner">
    <span>&#x1F4F2; Add to Home Screen for quick access</span>
    <button id="install-btn">Install</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var orders = [];
    var historyOrders = [];
    var currentTab = 'active';
    var activeOrderId = null;
    var reverseOrderId = null;
    var deferredInstallPrompt = null;

    // PWA install prompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredInstallPrompt = e;
      document.getElementById('install-banner').classList.add('show');
    });
    document.getElementById('install-btn').addEventListener('click', function() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(r) {
        if (r.outcome === 'accepted') document.getElementById('install-banner').classList.remove('show');
      });
    });

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function timeAgo(iso) {
      var s = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (s < 60)   return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      return Math.floor(s / 3600) + 'h ago';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-active').classList.toggle('active', tab === 'active');
      document.getElementById('tab-history').classList.toggle('active', tab === 'history');
      renderOrders();
    }

    function loadOrders() {
      var dot = document.getElementById('status-dot');
      dot.style.background = '#ffc107';
      
      Promise.all([
        fetch('/api/orders/pending-delivery').then(function(res) { return res.ok ? res.json() : []; }),
        fetch('/api/orders/picked-up').then(function(res) { return res.ok ? res.json() : []; })
      ])
      .then(function(results) {
        orders = results[0] || [];
        historyOrders = results[1] || [];
        
        document.getElementById('badge-active-count').textContent = orders.length;
        document.getElementById('badge-history-count').textContent = historyOrders.length;
        
        renderOrders();
        dot.style.background = 'var(--green)';
      })
      .catch(function(e) {
        dot.style.background = '#ff4a4a';
        showToast('Could not load: ' + e.message);
      });
    }

    function cleanAddr(s) {
      return (s || '')
        .replace(/\[Maps Pin:[^\]]*\]/gi, '')
        .replace(/[\r\n\t]+/g, ' ')
        .trim();
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderOrders() {
      var wrap = document.getElementById('list-wrap');
      var list = currentTab === 'active' ? orders : historyOrders;

      if (!list || !list.length) {
        if (currentTab === 'active') {
          wrap.innerHTML = '<div class="empty"><div class="empty-icon">&#x1F6F5;</div><div class="empty-title">No active delivery orders</div><div class="empty-sub">New orders will appear here automatically</div></div>';
        } else {
          wrap.innerHTML = '<div class="empty"><div class="empty-icon">&#x1F4CB;</div><div class="empty-title">No picked up history yet</div><div class="empty-sub">Delivered orders will show up here</div></div>';
        }
        return;
      }

      var html = '';
      if (currentTab === 'active') {
        // Active tab shows not picked up orders (pending, confirmed, preparing, ready, completed)
        var active = list.filter(function(o) { return ['pending','confirmed','preparing','ready','completed'].indexOf(o.status) >= 0; });
        var other  = list.filter(function(o) { return ['pending','confirmed','preparing','ready','completed'].indexOf(o.status) < 0; });
        
        if (active.length) {
          html += '<div class="section-title">Active &mdash; ' + active.length + ' order' + (active.length > 1 ? 's' : '') + '</div>';
          html += active.map(function(o) { return cardHTML(o, false); }).join('');
        }
        if (other.length) {
          html += '<div class="section-title" style="margin-top:1.25rem">Other</div>';
          html += other.map(function(o) { return cardHTML(o, false); }).join('');
        }
      } else {
        // History tab shows picked up / delivered orders
        html += '<div class="section-title">Picked Up &mdash; ' + list.length + ' order' + (list.length > 1 ? 's' : '') + '</div>';
        html += list.map(function(o) { return cardHTML(o, true); }).join('');
      }

      wrap.innerHTML = html;
    }

    var SHOW_PAYMENT_FOR = ['whatsapp', 'app', 'in-store'];

    function originEmoji(src) {
      var s = (src || '').toLowerCase();
      if (s === 'whatsapp') return '&#x1F4AC; ';
      if (s === 'app')      return '&#x1F4F1; ';
      if (s === 'toters')   return '&#x1F6B2; ';
      if (s === 'noknok')   return '&#x1F6AA; ';
      return '&#x1F3EA; ';
    }

    function isToday(dateInput) {
      if (!dateInput) return false;
      var d = new Date(dateInput);
      if (isNaN(d.getTime())) return false;
      var orderDate = d.toLocaleDateString('en-CA', { timeZone: 'Asia/Beirut' });
      var todayDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Beirut' });
      return orderDate === todayDate;
    }

    function cardHTML(o, isHistory) {
      var name   = (o.customer_name || 'Customer').trim();
      var addr   = cleanAddr(o.delivery_address);
      var items  = (o.items || []).filter(function(i) { return i && i.product_name; }).map(function(i) { return i.quantity + 'x ' + i.product_name; }).join(' - ') || '-';
      
      var badges = {
        pending:   'badge-pending',
        confirmed: 'badge-confirmed',
        preparing: 'badge-preparing',
        ready:     'badge-ready',
        completed: 'badge-completed',
        delivered: 'badge-delivered'
      };
      var labels = {
        pending:   'Pending',
        confirmed: 'Confirmed',
        preparing: 'Preparing',
        ready:     'Ready',
        completed: 'Completed',
        delivered: 'Picked Up'
      };
      
      var badge  = badges[o.status] || 'badge-delivered';
      var label  = labels[o.status] || o.status;
      var origin = o.order_source || 'In-Store';
      var showPay = SHOW_PAYMENT_FOR.indexOf(origin.toLowerCase()) >= 0;
      var payMethod = o.payment_method || '';
      var payClass  = payMethod.toLowerCase() === 'whish' ? 'pay-whish' : 'pay-cash';
      var payLabel  = payMethod || 'Cash';
      var driverPhone = o.driver_phone ? o.driver_phone : '';
      var metaHtml  = '<div class="order-meta">' +
        '<span class="origin-pill">' + originEmoji(origin) + esc(origin) + '</span>' +
        (showPay ? '<span class="pay-pill ' + payClass + '">&#x1F4B0; ' + esc(payLabel) + '</span>' : '') +
        (driverPhone ? '<span class="origin-pill" style="background:rgba(66,165,245,0.15);color:#42a5f5;border-color:rgba(66,165,245,0.3);">&#x1F50C; Driver: ' + esc(driverPhone) + '</span>' : '') +
        '</div>';

      var canReverse = isHistory && isToday(o.created_at);
      var reverseBtn = canReverse ?
        '<button class="btn-reverse-card" onclick="openReverseConfirm(' + o.id + ', event)">' +
          '&#x21A9;&#xFE0F; Reverse to Preparing' +
        '</button>' : '';

      return '<div class="order-card" onclick="' + (isHistory ? '' : 'openQR(' + o.id + ')') + '">' +
        '<div class="order-card-top">' +
          '<span class="order-id">#' + o.id + '</span>' +
          '<div style="display:flex;align-items:center;gap:0.5rem;">' +
            '<span class="order-badge ' + badge + '">' + label + '</span>' +
            '<span class="order-time">' + timeAgo(o.created_at) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="order-name">&#x1F464; ' + esc(name) + '</div>' +
        (addr ? '<div class="order-addr">&#x1F4CD; ' + esc(addr) + '</div>' : '') +
        metaHtml +
        '<div class="order-bottom">' +
          '<span class="order-items-preview">&#x1F6D2; ' + esc(items) + '</span>' +
          '<span class="order-total">$' + Number(o.total_amount || 0).toFixed(2) + '</span>' +
        '</div>' +
        reverseBtn +
      '</div>';
    }

    window.openQR = function(orderId) {
      activeOrderId = orderId;
      var order = null;
      for (var i = 0; i < orders.length; i++) { if (orders[i].id === orderId) { order = orders[i]; break; } }
      if (!order) return;

      var name = (order.customer_name || 'Customer').trim();
      var addr = cleanAddr(order.delivery_address);
      var origin = order.order_source || 'In-Store';
      var payMethod = order.payment_method || 'Cash';
      var showPay = SHOW_PAYMENT_FOR.indexOf(origin.toLowerCase()) >= 0;

      document.getElementById('m-order-id').textContent = 'Order #' + orderId;
      document.getElementById('m-customer').textContent = (order.customer_phone ? order.customer_phone + '  -  ' : '') + name;
      document.getElementById('m-address').textContent  = addr ? addr : '';

      var mOrigin = document.getElementById('m-origin');
      mOrigin.innerHTML = originEmoji(origin) + esc(origin);
      mOrigin.style.display = 'inline-block';

      var mPay = document.getElementById('m-payment');
      if (showPay) {
        mPay.innerHTML = '&#x1F4B0; ' + esc(payMethod || 'Cash');
        mPay.className = 'pay-pill ' + (payMethod.toLowerCase() === 'whish' ? 'pay-whish' : 'pay-cash');
        mPay.style.display = 'inline-block';
      } else {
        mPay.style.display = 'none';
      }

      var canvas = document.getElementById('qr-canvas');
      canvas.innerHTML = '';
      var url = 'https://ovrload-nine.vercel.app/driver/scan?orderId=' + orderId;
      new QRCode(canvas, { text: url, width: 200, height: 200, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });

      var saved = localStorage.getItem('driver_phone');
      if (saved) document.getElementById('driver-phone').value = saved;

      document.getElementById('qr-modal').classList.add('open');
    };

    document.getElementById('btn-close').addEventListener('click', closeModal);
    document.getElementById('qr-modal').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeModal(); });
    function closeModal() { document.getElementById('qr-modal').classList.remove('open'); activeOrderId = null; }

    // Reverse status to Preparing modal handler
    window.openReverseConfirm = function(orderId, event) {
      if (event) event.stopPropagation();
      reverseOrderId = orderId;
      document.getElementById('confirm-modal-body').innerHTML = 'Are you sure you want to change the status of <b>Order #' + orderId + '</b> to <b>Preparing</b>?';
      document.getElementById('confirm-modal').classList.add('open');
    };

    document.getElementById('btn-cancel-reverse').addEventListener('click', closeConfirmModal);
    document.getElementById('confirm-modal').addEventListener('click', function(e) { if (e.target === e.currentTarget) closeConfirmModal(); });
    function closeConfirmModal() { document.getElementById('confirm-modal').classList.remove('open'); reverseOrderId = null; }

    document.getElementById('btn-confirm-reverse').addEventListener('click', function() {
      if (!reverseOrderId) return;
      var btn = document.getElementById('btn-confirm-reverse');
      btn.disabled = true; btn.textContent = 'Updating...';

      fetch('/api/orders/' + reverseOrderId + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'preparing' })
      })
        .then(function(r) {
          if (r.ok) {
            closeConfirmModal();
            showToast('Order #' + reverseOrderId + ' status changed to Preparing');
            loadOrders();
            switchTab('active');
          } else {
            showToast('Failed to update status');
          }
        })
        .catch(function() { showToast('Connection error'); })
        .finally(function() {
          btn.disabled = false;
          btn.textContent = 'Yes, Change to Preparing';
        });
    });

    // Send via WhatsApp (phone fallback)
    document.getElementById('btn-send-wa').addEventListener('click', function() {
      var phone = document.getElementById('driver-phone').value.trim();
      if (!phone) { showToast('Enter your phone number'); return; }
      if (!activeOrderId) return;
      localStorage.setItem('driver_phone', phone);
      var btn = document.getElementById('btn-send-wa');
      btn.disabled = true; btn.textContent = '...';
      fetch('/api/driver/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: activeOrderId, phone: phone })
      })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          closeModal();
          showToast('Order #' + activeOrderId + ' marked as Picked Up!');
          loadOrders();
          if (data.waUrl) {
            window.open(data.waUrl, '_blank');
          }
        })
        .catch(function() { showToast('Connection error'); })
        .finally(function() { btn.disabled = false; btn.textContent = 'Send'; });
    });

    // Mark as picked up
    document.getElementById('btn-pickup').addEventListener('click', function() {
      if (!activeOrderId) return;
      var phoneInput = document.getElementById('driver-phone').value.trim() || localStorage.getItem('driver_phone') || '';
      var btn = document.getElementById('btn-pickup');
      btn.textContent = 'Updating...'; btn.disabled = true;
      fetch('/api/orders/' + activeOrderId + '/status', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'completed', driverPhone: phoneInput })
      })
        .then(function(r) {
          if (r.ok) {
            closeModal();
            showToast('Order #' + activeOrderId + ' picked up');
            loadOrders();
          } else {
            showToast('Failed to update');
          }
        })
        .catch(function() { showToast('Connection error'); })
        .finally(function() { btn.textContent = 'Mark as Picked Up'; btn.disabled = false; });
    });

    document.getElementById('refresh-btn').addEventListener('click', function() { loadOrders(); showToast('Refreshed'); });
    setInterval(loadOrders, 30000);

    // Boot
    loadOrders();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/driver-sw.js').catch(function() {});
    }
  </script>
</body>
</html>
