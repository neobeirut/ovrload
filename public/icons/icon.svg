<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8533"/>
      <stop offset="50%" stop-color="#e66e19"/>
      <stop offset="100%" stop-color="#cc5505"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(230, 110, 25, 0.4)" stroke-width="6"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="235" r="140" fill="#e66e19" opacity="0.2" filter="url(#glow)"/>

  <!-- Top Bun -->
  <path d="M136 210 C136 140 376 140 376 210 Z" fill="url(#orangeGrad)"/>
  <!-- Sesame seeds -->
  <circle cx="210" cy="175" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="256" cy="162" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="302" cy="175" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="235" cy="190" r="4.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="277" cy="190" r="4.5" fill="#ffffff" opacity="0.8"/>

  <!-- Patty / Fillings layer with Wave -->
  <path d="M120 230 C150 215 170 240 200 225 C230 210 250 235 280 220 C310 205 330 230 360 218 C375 212 392 225 392 238 C392 245 385 252 375 252 L137 252 C127 252 120 242 120 230 Z" fill="#ff4a4a"/>
  
  <!-- Cheese / Sauce Melt Layer -->
  <path d="M130 252 L382 252 L365 280 L340 262 L305 288 L275 262 L235 292 L205 262 L170 285 L148 262 Z" fill="#ffb84d"/>

  <!-- Bottom Bun -->
  <path d="M140 286 L372 286 C382 286 390 294 388 304 C382 334 330 348 256 348 C182 348 130 334 124 304 C122 294 130 286 140 286 Z" fill="url(#orangeGrad)"/>

  <!-- Brand Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Montserrat', 'Segoe UI', sans-serif">
    <text x="256" y="415" font-size="62" font-weight="900" letter-spacing="3" fill="#ffffff">
      OVR<tspan fill="#e66e19">LOAD</tspan>
    </text>
    <text x="256" y="452" font-size="18" font-weight="700" letter-spacing="6" fill="#8e8e93" text-transform="uppercase">
      OFFICIAL MENU
    </text>
  </g>
</svg>
